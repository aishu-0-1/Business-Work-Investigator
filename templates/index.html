
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Work Investigator</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1e3a8a">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        nav {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav h2 {
            font-size: 23px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            display: inline-block;
            margin: 8px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 20px auto;
                padding: 20px;
            }

            nav h2 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>Business Work Investigator</h2>
    </nav>

    <div class="container">

        <h1>Business Investigation</h1>

        <p class="subtitle">
            Your business investigation starts here.
        </p>

        <form action="/investigate" method="POST">

            <label for="business_name">Business Name</label>
            <input
                type="text"
                id="business_name"
                name="business_name"
                placeholder="Enter business name"
                required
            >

            <label for="industry">Industry</label>
            <select id="industry" name="industry" required>
                <option value="">Select Industry</option>
                <option value="Technology">Technology</option>
                <option value="Retail">Retail</option>
                <option value="Finance">Finance</option>
                <option value="Education">Education</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Manufacturing">Manufacturing</option>
                <option value="Other">Other</option>
            </select>

            <label for="location">Business Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter business location"
                required
            >

            <button type="submit">Start Investigation</button>

        </form>

        <div class="links">
            <a href="/dashboard">Dashboard</a>
            <a href="/history">Investigation History</a>
        </div>

    </div>

</body>
</html>
